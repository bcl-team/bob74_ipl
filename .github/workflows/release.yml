name: Release archive

on:
  push:
    branches: [master]
    tags:
      - 'v*'
      - 'enhanced-*'
  pull_request:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Package the checked-out revision
        run: |
          git -c core.autocrlf=false archive --format=tar.gz --prefix=bob74_ipl/ --output=bob74_ipl.tar.gz HEAD
          python3 tools/release/verify-archive.py bob74_ipl.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: bob74_ipl.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-archive
      - name: Publish the Docker-compatible release asset
        uses: softprops/action-gh-release@v3
        with:
          name: bob74_ipl ${{ github.ref_name }}
          files: bob74_ipl.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          make_latest: ${{ startsWith(github.ref_name, 'enhanced-') && 'false' || 'true' }}
